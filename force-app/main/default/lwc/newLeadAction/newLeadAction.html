<template>
    <lightning-card variant="brand" title="New Lead (Use Emirates ID Scanner)" icon-name="standard:lead">
        <div class="slds-align_absolute-center">
            <lightning-button variant="brand" label="New Lead" title="New Lead" onclick={handleOpenModal}>

            </lightning-button>
            <br />
        </div>
    </lightning-card>
    <template if:true={isShowModal}>
        <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true"
            aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                        title="Close" onclick={handleCloseModal}>
                        <lightning-icon icon-name="utility:close" alternative-text="close" variant="brand"
                            size="small"></lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>
                    <h2 id="modal-heading-01" class="slds-text-heading_medium slds-hyphenate">New Lead</h2>
                </header>

                <div class="slds-modal__content slds-p-around_medium">
                    <template if:true={showLoading}>
                        <lightning-spinner alternative-text="Loading..." size="medium"
                            class="spinnerClass"></lightning-spinner>
                    </template>
                    <lightning-layout multiple-rows>
                        <lightning-layout-item size="4" padding="around-small">
                            <lightning-layout multiple-rows>
                                <lightning-layout-item size="12">
                                    <lightning-combobox label="Salutation" options={saluationList}
                                        onchange={handleSaluationChange}></lightning-combobox>
                                </lightning-layout-item>
                                <lightning-layout-item size="12">
                                    <lightning-input type="text" label="First Name"
                                        onchange={handleFirstNameChange}></lightning-input>
                                </lightning-layout-item>
                                <lightning-layout-item size="12">
                                    <lightning-input type="text" label="Middle Name" onchange={handleMiddleNameChange}>
                                    </lightning-input>
                                </lightning-layout-item>
                                <lightning-layout-item size="12">
                                    <lightning-input type="text" label="Last Name"
                                        onchange={handleLastNameChange}></lightning-input>
                                </lightning-layout-item>
                                <lightning-layout-item size="12">
                                    <lightning-input type="text" label="Full Name in English"
                                        onchange={handleFullNameEngishChange}>
                                    </lightning-input>
                                </lightning-layout-item>
                                <lightning-layout-item size="12">
                                    <lightning-input type="text" label="Full Name in Arabic"
                                        onchange={handleFullNameArabicChange}>
                                    </lightning-input>
                                </lightning-layout-item>
                            </lightning-layout>
                        </lightning-layout-item>
                        <lightning-layout-item size="4" padding="around-small">
                            <lightning-layout multiple-rows>
                                <lightning-layout-item size="12">
                                    <lightning-input type="date" label="Birthdate" onchange={handleDOBChange}>
                                    </lightning-input>
                                </lightning-layout-item>
                                <lightning-layout-item size="12">
                                    <lightning-combobox label="Gender" options={genderList}
                                        onchange={handleGenderChange}></lightning-combobox>
                                </lightning-layout-item>
                                <lightning-layout-item size="12">
                                    <lightning-combobox label="Marital Status" options={maritalStatusList}
                                        onchange={handleMaritalStatusChange}></lightning-combobox>
                                </lightning-layout-item>
                                <lightning-layout-item size="12">
                                    <lightning-combobox label="Mobile Country Code" options={mobileCountryCodeList}
                                        onchange={handleMobileCountryCodeChange}></lightning-combobox>
                                </lightning-layout-item>
                                <lightning-layout-item size="12">
                                    <lightning-input type="phone" label="Mobile"
                                        onchange={handleMobileChange}></lightning-input>
                                </lightning-layout-item>
                                <lightning-layout-item size="12">
                                    <lightning-input type="email" label="Email"
                                        onblur={handleEmailChange}></lightning-input>
                                </lightning-layout-item>
                            </lightning-layout>
                        </lightning-layout-item>
                        <lightning-layout-item size="4" padding="around-small">
                            <lightning-layout multiple-rows>
                                <lightning-layout-item size="12">
                                    <lightning-combobox label="Nationality" options={nationalityList}
                                        onchange={handleNationalityChange}></lightning-combobox>
                                </lightning-layout-item>
                                <lightning-layout-item size="12">
                                    <lightning-input type="text" label="Passport"
                                        onchange={handlePassportChange}></lightning-input>
                                </lightning-layout-item>
                                <lightning-layout-item size="12">
                                    <lightning-input type="date" label="Passport Expiry Date"
                                        onchange={handlePassportExpiryDateChange}></lightning-input>
                                </lightning-layout-item>
                                <lightning-layout-item size="12">
                                    <lightning-input type="text" label="Place of Issue"
                                        onchange={handlePlaceOfIssueChange}></lightning-input>
                                </lightning-layout-item>
                                <lightning-layout-item size="12">
                                    <lightning-input type="text" label="Emirates ID #"
                                        onchange={handleEIDChange}></lightning-input>
                                </lightning-layout-item>
                                <lightning-layout-item size="12">
                                    <lightning-input type="date" label="EID Expiry Date"
                                        onchange={handleEIDExpiryDateChange}></lightning-input>
                                </lightning-layout-item>
                            </lightning-layout>
                        </lightning-layout-item>
                    </lightning-layout>
                </div>
                <footer class="slds-modal__footer">
                    <lightning-button onclick={handleCloseModal} variant="neutral" label="Cancel"></lightning-button>
                    &nbsp;&nbsp;
                    <lightning-button onclick={handleSave} variant="brand" label="Save"></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
