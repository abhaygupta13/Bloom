<template>
    <lightning-quick-action-panel header="Send Commission Document for Signature">
        <lightning-spinner if:true={isLoading}></lightning-spinner>

        <template if:false={isLoading}>
            <div class="slds-m-around_medium">
                <lightning-checkbox-group
                    name="docTypes"
                    label="Select document types"
                    options={options}
                    value={selectedValues}
                    onchange={handleSelectionChange}>
                </lightning-checkbox-group>
            </div>
        </template>

        <div slot="footer">
            <lightning-button label="Send" variant="brand" onclick={handleSend} disabled={isLoading}></lightning-button>
            <lightning-button label="Cancel" variant="neutral" onclick={handleCancel}></lightning-button>
        </div>
    </lightning-quick-action-panel>
</template>
