<template>



	<section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true"
		aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">

		<div class="slds-modal__container">

			<!-- Modal/Popup Box LWC body starts here -->
			<div class="slds-modal__content slds-p-around_large outer-div" id="modal-content-id-1">
			
				 <template if:true={showLoading}>
						<lightning-spinner alternative-text="Loading" size="medium" class="customSpinner">
						</lightning-spinner>
				 </template>
				
				<div class="slds-grid slds-gutters">

					<div class="slds-col slds-size_6-of-12">
						<video class="videoElement" style="width:100%" autoplay></video>
						<canvas class="slds-hide canvas"></canvas>
					</div>
					<div class="slds-col slds-size_6-of-12">
						<img src="" class="slds-hide imageElement" style="width:100%;height:100%" alt="captured image"/>
         </div>
					</div>
					<!--  <div class="camera-wrapper"> -->
					<div class="slds-align_absolute-center">

						<lightning-icon icon-name="action:scan_enabled" size="small" class="slds-m-top_large"
							label="Capture Image" onclick={captureImage}></lightning-icon>
						<lightning-icon icon-name="action:upload" size="small"
							class="slds-m-top_large slds-m-left_small slds-hide saveBtn" label="Save"
							onclick={handleSave}>
						</lightning-icon>
					</div>
				</div>
			</div>

			<div class="btn slds-modal__close close x-large">
				<lightning-button-icon variant="border-filled" size="small" icon-name="utility:close"
					onclick={closePopupWindow}></lightning-button-icon>
			</div>
	</section>
	<div class="slds-backdrop slds-backdrop_open"></div>




</template>
