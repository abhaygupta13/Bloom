<template>
    <lightning-card title="Documents Upload" icon-name="standard:document">
        <template if:false={showSuccessMessage}>

            <div class="slds-p-around_medium slds-box">
                <template if:true={isPersonCustomer}>
                    <template for:each={potentialTenantDocuments} for:item="doc">
                        <div key={doc.value} class="slds-m-bottom_medium">
                            <c-file-uploader label={doc.label} identifier={doc.value} onfileuploaded={handleFileUpload}
                                onfileremoved={handleFileRemove}>
                            </c-file-uploader>
                        </div>
                    </template>
                </template>
                <template if:false={isPersonCustomer}>
                    <template for:each={potentialOrganizationDocuments} for:item="doc">
                        <div key={doc.value} class="slds-m-bottom_medium">
                            <c-file-uploader label={doc.label} identifier={doc.value} onfileuploaded={handleFileUpload}
                                onfileremoved={handleFileRemove}>
                            </c-file-uploader>
                        </div>
                    </template>
                </template>
            </div>


            <div class="slds-p-around_medium">
                <label class="slds-checkbox slds-grid slds-grid_align-start">
            <lightning-input 
                type="checkbox"
                name="confirm"
                checked={isConfirmed}
                onchange={handleCheckboxChange}
                class="slds-m-right_small">
            </lightning-input>
            <span>
                I hereby confirm that all the information and documents provided by me are true, accurate, and complete to the best of my knowledge and belief.
                I understand that any false or misleading information may result in the rejection of my application and/or legal consequences.
            </span>
        </label>
            </div>

            <template if:true={isConfirmed}>
                <div class="slds-m-top_medium slds-align_absolute-center">
                    <lightning-button label="Submit Documents" variant="brand" onclick={handleUpload}
                        disabled={isUploadDisabled}>
                    </lightning-button>
                </div>
            </template>

            <!-- Uploading Spinner -->
            <template if:true={isUploading}>
                <div class="slds-align_absolute-center slds-m-top_medium">
                    <lightning-spinner alternative-text="Uploading..." size="medium"></lightning-spinner>
                </div>
            </template>

        </template>

        <!-- Success Message Display -->
        <template if:true={showSuccessMessage}>
            <div class="slds-text-align_center slds-m-around_medium">
                <lightning-icon icon-name="utility:success" size="large" alternative-text="Success" variant="success">
                </lightning-icon>
                <h2 class="slds-text-heading_medium slds-m-top_small">{statusMessage}</h2>
            </div>
        </template>
    </lightning-card>
</template>
