<template>

     <template if:true={isLoading}>
        <lightning-spinner alternative-text="Updating..."></lightning-spinner>
    </template>

    <!-- modal start -->      
 <template if:true={isShowModal}>
    <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true" aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">
        <div class="slds-modal__container">
            <!-- Modal Header -->
            <header class="slds-modal__header">
                <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={hideModalBox}>
                    <lightning-icon icon-name="utility:close"
                        alternative-text="close"
                        variant="inverse"
                        size="small"></lightning-icon>
                    <span class="slds-assistive-text">Close</span>
                </button>
                <h2 id="modal-heading-01" class="slds-text-heading_medium slds-hyphenate">{heading}</h2>
            </header>

            <!-- Modal Body -->
            <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
                <div class="slds-p-around_small">

                     <template if:true={isLoading}>
        <lightning-spinner alternative-text="Updating..."></lightning-spinner>
    </template>


                    <p class="slds-p-horizontal_x-small">
                        Do you want to change the case status to <strong>{status}</strong>?
                    </p>

                    <!-- Text Area for Comments -->
                    <lightning-textarea 
                        label="Comments" 
                        value={comments} 
                        onchange={handleCommentsChange}
                        required="true"
                        message-when-value-missing="Comments are required to update the status"
                        class="slds-p-top_small slds-m-bottom_small"
                    ></lightning-textarea>

                    <!-- Action Buttons -->
                    <div class="slds-grid slds-grid_align-center slds-m-top_medium">
                        <lightning-button label="Yes" variant="brand" class="slds-m-right_small" onclick={handleActions}></lightning-button>
                        <lightning-button label="No" variant="neutral" onclick={hideModalBox}></lightning-button>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <div class="slds-backdrop slds-backdrop_open"></div>
</template>

    <lightning-card title="">
                <div class="slds-grid slds-grid_align-end">

        <div class="slds-button-group" role="group">
            <template if:true={showAssignToMe}>

         <lightning-button 
                    label="Assign to Me" 
                    class="slds-m-right_small" 
                    
                    onclick={handleAssignToMe}>
                </lightning-button>
            </template>

            <!-- Approve Button -->
            <template if:true={showActions}>

                    <lightning-button 
                label="Approve" 
                class="slds-m-right_small" 
                
                onclick={handleApprove}>
            </lightning-button>

                <lightning-button 
                label="Reject" 
                class="slds-m-right_small" 
               
                onclick={handleReject}>
            </lightning-button>

                <lightning-button 
                label="Return To Customer" 
                class="slds-m-right_small" 
              
                onclick={handleRFI}>
            </lightning-button>
             
            </template>
        </div>
                </div>
    </lightning-card>
</template>
