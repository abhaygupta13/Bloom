<template>
    <lightning-quick-action-panel header="Send Document for Signature" class="outer-div">
        <lightning-spinner if:true={isLoading} class="customSpinner" alternative-text="Loading..."></lightning-spinner>

        <template if:false={isLoading}>
            <div class="grid-container">
                <div class="checkbox-group">
                    <template for:each={options} for:item="option">
                        <div key={option.value} class="checkbox-item">
                            <lightning-input
                                type="checkbox"
                                label={option.label}
                                value={option.value}
                                checked={option.isChecked}
                                onchange={handleCheckboxChange}>
                            </lightning-input>
                        </div>
                    </template>
                </div>
            </div>
        </template>

        <div slot="footer">
            <lightning-button label="Generate" variant="brand" onclick={handleGenerate} disabled={isLoading}></lightning-button>
            &nbsp;&nbsp;
            <lightning-button onclick={handleCancel} variant="neutral" label="Cancel"></lightning-button>
        </div>
    </lightning-quick-action-panel>
</template>
