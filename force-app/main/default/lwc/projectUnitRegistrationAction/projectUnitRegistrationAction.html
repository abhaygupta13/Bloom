<template>
    <template if:true={isModalOpen}>
    <div class="slds-backdrop slds-backdrop_open"></div>
        <!-- MODAL -->
        <section role="dialog"
                 tabindex="-1"
                 aria-modal="true"
                 class="slds-modal slds-fade-in-open">

            <div class="slds-modal__container">

                <!-- HEADER -->
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                            title="Close"
                            onclick={handleCloseModal}>
                        <lightning-icon icon-name="utility:close"
                                        alternative-text="close"
                                        size="small">
                        </lightning-icon>
                    </button>

                    <h2 class="slds-text-heading_medium">
                        Unit Registration
                    </h2>
                </header>

                <!-- BODY -->
                <div class="slds-modal__content slds-p-around_medium">

                    <!-- TOP BAR -->
                    <div class="slds-box slds-theme_default slds-m-bottom_medium">
                        <lightning-layout vertical-align="center">

                            <lightning-layout-item size="8">
                                <p>Please select eligible units for registration</p>
                            </lightning-layout-item>

                            <lightning-layout-item size="4" class="slds-text-align_right">
                                <span class="slds-badge slds-theme_brand">
                                    {selectedRecords} / {totalRecords}
                                </span>
                            </lightning-layout-item>

                        </lightning-layout>
                    </div>

                    <!-- FILTER SECTION -->
                    <lightning-layout vertical-align="end" class="slds-m-bottom_medium">

                        <lightning-layout-item size="4" padding="horizontal-small">
                            <lightning-input 
                                type="date" 
                                label="Select Registration Date"
                                value={selectedDate}
                                onchange={handleDateChange}>
                            </lightning-input>
                        </lightning-layout-item>
                    </lightning-layout>

                    <!-- TABLE -->
                    <template if:true={dataTableRender}>
                        <div class="slds-m-top_medium">
                        <div class="slds-table_edit_container slds-is-relative"
                             style="width: 100%; overflow-x: auto;">

                            <table class="slds-table slds-table_cell-buffer slds-table_bordered">

                                <!-- HEADER -->
                                <thead>
                                    <tr>
                                        <th>
                                            <lightning-input type="checkbox"
                                                variant="label-hidden"
                                                onchange={onSelecAllCheckbox}>
                                            </lightning-input>
                                        </th>
                                        <th>Sales Order</th>
                                        <th>Status</th>
                                        <th>Unit Number</th>
                                        <th>Plot Number</th>
                                        <th>Sold Date</th>
                                        <th>Registration Date</th>
                                        <th>Action</th>
                                    </tr>
                                </thead>

                                <!-- BODY -->
                                <tbody>
                                    <template for:each={data} for:item="row">
                                        <tr key={row.Id} class="slds-hint-parent">

                                            <td>
                                                <lightning-input type="checkbox"
                                                    data-id={row.Id}
                                                    checked={row.isChecked}
                                                    disabled={row.isReadOnly}
                                                    onchange={onCheckboxClick}>
                                                </lightning-input>
                                            </td>

                                            <td>
                                                <a href={row.salesOrderLink} target="_blank">
                                                    {row.activeSalesOrderName}
                                                </a>
                                            </td>

                                            <td>{row.Status__c}</td>

                                            <td>
                                                <a href={row.unitLink} target="_blank">
                                                    {row.Name}
                                                </a>
                                            </td>

                                            <td>{row.plotNumber}</td>
                                            <td>{row.soldDate}</td>
                                            <td>{row.RegistrationDate__c}</td>

                                            <!-- ACTION -->
                                            <td>

                                                <template lwc:if={row.isReadOnly}>
                                                    <template lwc:if={row.filePreview}>
                                                <lightning-icon data-id={row.filePreview} class="icon" icon-name="utility:document_preview"
                                                    variant="success" size="small" title="Preview project-unit registration document" onclick={handleFilePreview}>
                                                </lightning-icon>
                                            </template>
                                            <template lwc:else>
                                                <lightning-icon class="icon" icon-name="utility:document_preview"
                                                    variant="error" size="small" title="Document not available for preview">
                                                </lightning-icon>
                                            </template>
                                                </template>

                                                <template lwc:else>

                                                <div class="action-icons">

                                                    <div class="upload-wrapper">

                                                        <lightning-icon
                                                            data-id={row.Id}
                                                            icon-name="utility:upload"
                                                            variant="success"
                                                            size="small"
                                                            onclick={handleOpenfileUpload}>
                                                        </lightning-icon>

                                                        <input
                                                            type="file"
                                                            data-id={row.Id}
                                                            accept={acceptedFormats}
                                                            onchange={openUnitFileUpload}
                                                            class="hidden-file-input" />

                                                    </div>

                                                    <template lwc:if={row.filePreview}>
                                                        <lightning-icon
                                                            data-id={row.filePreview}
                                                            icon-name="utility:preview"
                                                            variant="success"
                                                            size="small"
                                                            onclick={handleFilePreview}>
                                                        </lightning-icon>
                                                    </template>

                                                </div>

                                            </template>

                                            </td>
                                        </tr>
                                    </template>
                                </tbody>

                            </table>
                        </div>
                        </div>
                    </template>

                </div>

                <!-- FOOTER -->
                <footer class="slds-modal__footer">
                    <lightning-button 
                        variant="neutral"
                        label="Cancel"
                        onclick={handleCloseModal}>
                    </lightning-button>

                    &nbsp;&nbsp;

                    <lightning-button 
                        variant="brand"
                        label="Submit"
                        disabled={isSaveDisabled}
                        onclick={onSave}>
                    </lightning-button>
                </footer>

            </div>
        </section>
    </template>
</template>
