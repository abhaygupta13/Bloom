<template>

    <!-- ===================================================== -->
    <!-- MAIN UNIT REGISTRATION MODAL -->
    <!-- ===================================================== -->

    <template lwc:if={isModalOpen}>

        <div class="slds-backdrop slds-backdrop_open"></div>

        <section
            role="dialog"
            tabindex="-1"
            aria-modal="true"
            class="slds-modal slds-fade-in-open">

            <div class="slds-modal__container slds-is-relative">

                <!-- Spinner -->
                <template lwc:if={isLoading}>

                    <lightning-spinner
                        alternative-text="Processing..."
                        size="medium"
                        variant="brand">
                    </lightning-spinner>

                </template>


                <!-- ================================================= -->
                <!-- HEADER -->
                <!-- ================================================= -->

                <header class="slds-modal__header">

                    <button
                        class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                        title="Close"
                        onclick={handleCloseModal}>

                        <lightning-icon
                            icon-name="utility:close"
                            alternative-text="Close"
                            size="small">
                        </lightning-icon>

                        <span class="slds-assistive-text">
                            Close
                        </span>

                    </button>

                    <h2 class="slds-text-heading_medium">
                        Unit Registration
                    </h2>

                </header>


                <!-- ================================================= -->
                <!-- BODY -->
                <!-- ================================================= -->

                <div class="slds-modal__content slds-p-around_medium">

                    <!-- TOP INFORMATION -->
                    <div class="slds-box slds-theme_default slds-m-bottom_medium">

                        <lightning-layout
                            vertical-align="center">

                            <lightning-layout-item size="8">

                                <p>
                                    Please select eligible units for registration
                                </p>

                            </lightning-layout-item>


                            <lightning-layout-item
                                size="4"
                                class="slds-text-align_right">

                                <span class="slds-badge slds-theme_brand">

                                    {selectedRecords}
                                    /
                                    {totalRecords}

                                </span>

                            </lightning-layout-item>

                        </lightning-layout>

                    </div>


                    <!-- ================================================= -->
                    <!-- REGISTRATION DATE -->
                    <!-- ================================================= -->

                    <div class="slds-grid slds-wrap slds-m-bottom_medium">

                        <div class="slds-size_1-of-3 slds-p-right_small">

                            <lightning-input
                                type="date"
                                label="Select Registration Date"
                                value={selectedDate}
                                onchange={handleDateChange}>
                            </lightning-input>

                        </div>

                    </div>


                    <!-- ================================================= -->
                    <!-- DATA TABLE -->
                    <!-- ================================================= -->

                    <template lwc:if={dataTableRender}>

                        <div class="slds-m-top_medium">

                            <lightning-datatable
                                key-field="Id"
                                data={data}
                                columns={columns}
                                selected-rows={selectedRowKeys}
                                disabled-rows={disabledRowKeys}
                                onrowselection={handleRowSelection}
                                onsort={handleSort}
                                sorted-by={sortBy}
                                sorted-direction={sortDirection}>
                            </lightning-datatable>

                        </div>

                    </template>


                    <!-- ================================================= -->
                    <!-- NO RECORDS -->
                    <!-- ================================================= -->

                    <template lwc:if={noRecordsFound}>

                        <div
                            class="slds-align_absolute-center slds-p-around_medium">

                            No records found.

                        </div>

                    </template>

                </div>


                <!-- ================================================= -->
                <!-- FOOTER -->
                <!-- ================================================= -->

                <footer class="slds-modal__footer">

                    <lightning-button
                        variant="neutral"
                        label="Cancel"
                        onclick={handleCloseModal}>
                    </lightning-button>


                    <lightning-button
                        class="slds-m-left_small"
                        variant="brand"
                        label="Submit"
                        disabled={isSaveDisabled}
                        onclick={handleSubmitClick}>
                    </lightning-button>

                </footer>

            </div>

        </section>

    </template>


    <!-- ========================================================= -->
    <!-- FILE UPLOAD MODAL                                         -->
    <!-- ========================================================= -->

    <template lwc:if={isFileUploadModalOpen}>

        <div class="slds-backdrop slds-backdrop_open"></div>

        <section
            role="dialog"
            tabindex="-1"
            aria-modal="true"
            aria-labelledby="file-upload-modal-heading"
            class="slds-modal slds-fade-in-open">

            <div class="slds-modal__container slds-is-relative">

                <!-- Spinner -->
                <template lwc:if={isLoading}>

                    <lightning-spinner
                        alternative-text="Processing..."
                        size="medium"
                        variant="brand">
                    </lightning-spinner>

                </template>


                <!-- ================================================= -->
                <!-- HEADER -->
                <!-- ================================================= -->

                <header class="slds-modal__header">

                    <button
                        class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                        title="Close"
                        onclick={handleCloseFileUploadModal}>

                        <lightning-icon
                            icon-name="utility:close"
                            alternative-text="Close"
                            size="small">
                        </lightning-icon>

                        <span class="slds-assistive-text">
                            Close
                        </span>

                    </button>


                    <h2
                        id="file-upload-modal-heading"
                        class="slds-text-heading_medium">

                        Upload Registration Document

                    </h2>

                </header>


                <!-- ================================================= -->
                <!-- BODY -->
                <!-- ================================================= -->

                <div class="slds-modal__content slds-p-around_medium">
                    <!-- FILE UPLOAD -->
                    <div class="slds-m-top_medium">

                        <lightning-input
                            type="file"
                            label="Registration Document"
                            accept={acceptedFormats}
                            onchange={handleFileChange}>
                        </lightning-input>

                    </div>


                    <!-- SELECTED FILE -->
                    <template lwc:if={fileData}>

                        <div
                            class="slds-box slds-theme_shade slds-m-top_medium">

                            <div
                                class="slds-grid slds-grid_vertical-align-center">

                                <lightning-icon
                                    icon-name="doctype:pdf"
                                    alternative-text="PDF"
                                    size="small"
                                    class="slds-m-right_small">
                                </lightning-icon>


                                <div>

                                    <p class="slds-text-body_regular">

                                        {fileData.filename}

                                    </p>

                                    <p class="slds-text-body_small slds-text-color_weak">

                                        PDF selected

                                    </p>

                                </div>

                            </div>

                        </div>

                    </template>

                </div>


                <!-- ================================================= -->
                <!-- FOOTER -->
                <!-- ================================================= -->

                <footer class="slds-modal__footer">

                    <lightning-button
                        variant="neutral"
                        label="Cancel"
                        onclick={handleCloseFileUploadModal}>
                    </lightning-button>


                    <lightning-button
                        class="slds-m-left_small"
                        variant="brand"
                        label="Submit"
                        disabled={isFileUploadSubmitDisabled}
                        onclick={handleFileUploadSubmit}>
                    </lightning-button>

                </footer>

            </div>

        </section>

    </template>

</template>
