<template>
    <lightning-quick-action-panel header="Send Offer">
        <div class="slds-p-around_medium">
            <p class="slds-text-heading_small">
                Are you sure you want to send this offer to the customer?
            </p>

            <template if:true={isLoading}>
                <lightning-spinner size="medium" alternative-text="Sending..."></lightning-spinner>
            </template>
        </div>

        <div slot="footer">
            <lightning-button variant="neutral" label="Cancel" onclick={handleCancel}></lightning-button>
            <lightning-button
                variant="brand"
                label="Send"
                class="slds-m-left_small"
                onclick={handleSend}>
            </lightning-button>
        </div>
    </lightning-quick-action-panel>
</template>
