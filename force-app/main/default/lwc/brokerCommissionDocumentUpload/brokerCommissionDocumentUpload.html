<template >
    <template if:true={showForm}>
        <template if:true={isUploading}>
            <lightning-spinner alternative-text="Uploading..." size="medium"></lightning-spinner>
        </template>
        <lightning-card title="Upload Your Commission Invoice" icon-name="standard:document">
            <div class="slds-p-around_medium slds-box">
                <lightning-input
                    type="file"
                    label="Commission Invoice"
                    accept=".pdf"
                    onchange={handleFileChange}
                    variant="label-stacked">
                </lightning-input>

                <template if:true={fileName}>
                    <div class="slds-m-top_small slds-box slds-box_x-small slds-grid slds-grid_align-spread">
                        <span>{fileName}</span>
                        <lightning-icon icon-name="utility:close" size="x-small" alternative-text="Remove File"
                            onclick={resetForm} class="slds-m-left_xx-small slds-icon-text-error"></lightning-icon>
                    </div>
                </template>
            </div>

            <div class="slds-p-around_medium">
                <label class="slds-checkbox slds-grid slds-grid_align-start">
                    <lightning-input 
                        type="checkbox"
                        name="confirm"
                        checked={isConfirmed}
                        onchange={handleCheckboxChange}
                        class="slds-m-right_small">
                    </lightning-input>
                    <span>
                        I confirm that the attached invoice is true, accurate, and complete. 
                        I understand that providing false or misleading information may result in invoice rejection and potential legal action.
                    </span>
                </label>
            </div>

            
            <div class="slds-m-top_medium slds-align_absolute-center">
                <lightning-button
                    label="Submit"
                    variant="brand"
                    class="slds-m-top_medium"
                    onclick={handleFileUpload}
                    disabled={disableUploadButton}>
                </lightning-button>
            </div>
        </lightning-card>
    </template>
</template>
