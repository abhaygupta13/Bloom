<template>
	<lightning-card variant="Narrow" title="Documents" icon-name="standard:document_reference">
    <template if:true={showButton}>
<lightning-icon icon-name='utility:download' 
				 variant='success' 
				 size='small' 
				 slot="actions" 
                class="right-icon"
				onclick={handleDownload}>
 </lightning-icon>	
	</template>
	
    <template if:true={showCreateBtn}>
        <!-- New icon on the right side with spacing -->
        <lightning-icon icon-name="action:new" 
                        onclick={showRecordEditForm} 
                        size="xx-small" 
                        slot="actions"
                        class="right-icon">
        </lightning-icon>
    </template>
		<div class="spinner">
			<template if:true={isLoading}>
				<lightning-spinner alternative-text="Loading" variant="brand" size="large">
				</lightning-spinner>
			</template>
		</div>

		<template if:true={docRecords}>

			<!-- <div class="slds-page-header slds-page-header_joined slds-page-header_bleed slds-shrink-none test-headerRegion slds-is-relative slds-page-header-no-border"
				style="margin-bottom: 15px;">
				<lightning-icon style="background-color: #FF5D2D;" icon-name="standard:document_reference" size="small">
				</lightning-icon>
				<b class="slds-m-left_x-small">Documents</b>
			</div> -->


			<table class="slds-table_bordered">
				<thead>
					<tr class="slds-line-height_reset">
					</tr>
				</thead>
				<tbody>
					<template for:each={docRecords} for:item="item" for:index="index">
						<tr class="slds-hint-parent" key={item.Id}>
							<td data-label="" style="width:170px;">
								{item.Name}
							</td>
							<td data-label="">
                                
								<template if:false={item.contentDocId}>
									<div class="slds-grid slds-wrap">
										<lightning-input type="file" accept=""
											label="Attachment" data-id={item.Id} onchange={openfileUpload}
											class="customFile">
										</lightning-input>
										<span style="margin-top: 7px;padding-right: 10px;text-transform: uppercase;padding-left: 10px;">or</span>
										<div class="slds-col slds-size_1-of-4">
											<lightning-icon icon-name="action:add_photo_video" size="xx-small"
												onclick={capureViewHandler} data-id={item.Id}></lightning-icon>

										</div>
									</div>

								</template>

								<template if:true={item.contentDocId}>
									<!--lightning-button label="Delete" data-id={item.Id} onclick={handleDeleteFile}
										class="slds-m-left_x-small"></lightning-button-->
									<lightning-icon style="margin:0 0 0 0px;" icon-name="action:delete" size="xx-small"
										data-id={item.Id} onclick={handleDeleteFile} class="slds-m-left_x-small">
									</lightning-icon>
								</template>


								<template if:true={item.contentDocId}>
									<lightning-icon style="margin:0 0 0 45px;" icon-name="action:preview"
										size="xx-small" data-id={item.contentDocId} onclick={handleFilePreview}>
									</lightning-icon>
									<!--lightning-button style="margin:0 0 0 20px;" label="Preview"
										data-id={item.contentDocId} onclick={handleFilePreview}></lightning-button-->
								</template>


							</td>

						</tr>
					</template>
				</tbody>
			</table>
		</template>

		<template if:true={isModalOpen}>

			<c-image-capture-from-camera image-document-id={imageDocumentId} onhandlesuccess={handleCaputeOnSuccess}
				onhandleclose={handleClosePopup}>
			</c-image-capture-from-camera>

		</template>

		<template if:false={docRecords}>
			<div class="slds-align_absolute-center" style="margin-top: 29px;font-weight: bold; padding:15px;">No records
				found.</div>
		</template>

		<template if:true={showDocRecModal}>
			<!-- Modal/Popup Box LWC starts here -->
			<section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true"
				aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">
				<div class="slds-modal__container">
					<!-- Modal/Popup Box LWC header here -->
					<header class="slds-modal__header">
						<button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={closeDocRecModal}>
                        <lightning-icon icon-name="utility:close"
                            alternative-text="close"
                            variant="inverse"
                            size="small" ></lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>
						<h2 id="modal-heading-01" class="slds-text-heading_medium slds-hyphenate">Create Document</h2>
					</header>
					<!-- Modal/Popup Box LWC body starts here -->
					<lightning-record-edit-form object-api-name="Document__c" onsubmit={handleDocRecSubmit} onsuccess={handleDocRecSuccess}>

						<div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
							<lightning-messages> </lightning-messages>
							<lightning-input-field field-name="Document_Name__c" required="true" value={docName}> </lightning-input-field>
							<lightning-input-field field-name="Document_Type__c" required="true"> </lightning-input-field>
							<lightning-input-field class="slds-hide" field-name={sObjectLookupApiname} value={recordId}> </lightning-input-field>

						</div>
						<!-- Modal/Popup Box LWC footer starts here -->
						<footer class="slds-modal__footer">
							<lightning-button class="slds-m-top_small" variant="brand" type="submit" name="update"
								label="Create">
							</lightning-button>
						</footer>
					</lightning-record-edit-form>
				</div>
			</section>
			<div class="slds-backdrop slds-backdrop_open"></div>
		</template>


	</lightning-card>


</template>
