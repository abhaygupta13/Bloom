<template>
    <div class="slds-text-align_left slds-m-bottom_medium">
        <img src={bloomLogoUrl} alt="Bloom Logo" style="max-width:200px;background:#FFF"/>
    </div>
    <template if:true={isLoading}>
        <lightning-spinner alternative-text="Loading" size="medium">
        </lightning-spinner>
    </template>
    <!-- Already Responded -->
    <template if:true={isResponded}>
        <div class="slds-p-around_large slds-theme_default">
            <lightning-card>
                <div class="slds-p-around_large slds-align_absolute-center">
                    <div class="slds-text-align_center">
                        <lightning-icon icon-name="utility:success" alternative-text="Success" size="large"
                            variant="success">
                        </lightning-icon>
                        <h2 class="slds-text-heading_medium slds-m-top_medium"> Your response has already been
                            submitted.</h2>
                        <p class="slds-text-body_regular slds-m-top_small">Thank you for your response.</p>
                    </div>
                </div>
            </lightning-card>
        </div>
    </template>

    <!-- expired link -->
    <template if:true={isExpired}>
        <div class="slds-p-around_large slds-theme_default">
            <lightning-card>
                <div class="slds-p-around_large slds-align_absolute-center">
                    <div class="slds-text-align_center">
                        <lightning-icon icon-name="utility:error" alternative-text="Expired" size="large"
                            variant="error">
                        </lightning-icon>
                        <h2 class="slds-text-heading_medium slds-m-top_medium">
                            The link has been expired.
                        </h2>
                        <p class="slds-text-body_regular slds-m-top_small">
                            This lease renewal link is no longer valid.
                        </p>
                    </div>

                </div>
            </lightning-card>
        </div>
    </template>

    <!-- Response Form -->
    <template if:true={recordLoaded}>
        <div class="slds-p-around_large slds-theme_default">
            <lightning-card title="Lease Renewal Response">
                <div class="slds-p-around_large">
                    <!-- Leasing Information -->
                    <lightning-record-view-form record-id={reminder.LeasingOrder__c} object-api-name="LeasingOrder__c">
                        <div class="slds-section">
                            <h3 class="slds-section__title slds-theme_shade slds-p-around_small">
                                Leasing Information
                            </h3>
                            <div class="slds-grid slds-wrap slds-gutters slds-m-top_medium">
                                <div class="slds-col slds-size_1-of-2">
                                    <lightning-output-field field-name="LeasingOrderNumber__c">
                                    </lightning-output-field>
                                </div>

                                <div class="slds-col slds-size_1-of-2">
                                    <lightning-output-field field-name="LeasingStartDate__c">
                                    </lightning-output-field>
                                </div>

                                <div class="slds-col slds-size_1-of-2">
                                    <lightning-output-field field-name="LeasingEndDate__c">
                                    </lightning-output-field>
                                </div>

                                <div class="slds-col slds-size_1-of-2">
                                    <lightning-output-field field-name="AppliedAnnualRent__c">
                                    </lightning-output-field>
                                </div>

                            </div>

                        </div>
                    </lightning-record-view-form>
                    <!-- Renewal Decision -->
                    <div class="slds-m-top_x-large">
                        <h3 class="slds-section__title slds-theme_shade slds-p-around_small">
                            Renewal Decision
                        </h3>
                        <div class="slds-p-top_medium">
                            <lightning-radio-group name="renewalDecision" label="Please choose your renewal decision"
                                options={options} value={response} onchange={handleChange} type="radio" required>
                            </lightning-radio-group>

                            <template if:true={validationMessage}>
                                <div class="slds-text-color_error slds-m-top_x-small">
                                    {validationMessage}
                                </div>
                            </template>
                        </div>
                    </div>

                    <!-- Submit Section -->
                    <div class="slds-align_absolute-center slds-m-top_x-large">
                        <div class="slds-is-relative">
                            <template if:true={isSaving}>
                                <lightning-spinner alternative-text="Submitting response..." size="small">
                                </lightning-spinner>
                            </template>
                            <lightning-button variant="brand" label="Submit Response" onclick={save}
                                disabled={isSaving}>
                            </lightning-button>
                        </div>
                    </div>
                </div>
            </lightning-card>
        </div>
    </template>
</template>
