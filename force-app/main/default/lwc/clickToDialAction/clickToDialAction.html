<template>

    <!-- <lightning-quick-action-panel header="Click to Dial"> -->
    <div class="slds-p-around_medium">

        <!-- Body Content -->
        <div class="slds-is-relative">

            <!-- Loading Spinner -->
            <template if:true={isLoading}>
                <lightning-spinner
                    alternative-text="Loading..."
                    size="small">
                </lightning-spinner>
            </template>

            <!-- Empty State -->
            <template if:true={isPhoneListEmpty}>
                <div class="slds-text-align_center slds-p-vertical_large slds-text-color_weak">
                    No phone numbers found for this record.
                </div>
            </template>


            <!-- Phone List -->
            <template if:true={showPhoneList}>

                <template for:each={phoneList} for:item="phone">

                    <div key={phone.label}
                        class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-p-vertical_small slds-border_bottom list-item">

                        <div class="slds-media slds-media_center">

                            <div class="slds-media__figure">
                                <lightning-icon
                                    icon-name="utility:call"
                                    size="small"
                                    variant="brand">
                                </lightning-icon>
                            </div>

                            <div class="slds-media__body">
                                <p class="slds-text-title_bold slds-line-height_reset">
                                    {phone.label}
                                </p>

                                <p class="slds-text-body_regular slds-text-color_weak">
                                    {phone.value}
                                </p>
                            </div>

                        </div>


                        <lightning-button-icon
                            icon-name="utility:call"
                            variant="border-filled"
                            alternative-text="Call Now"
                            data-phone={phone.value}
                            data-label={phone.label}
                            onclick={handleCall}>
                        </lightning-button-icon>

                    </div>

                </template>

            </template>

        </div>


        <!-- Footer -->
        <!-- <div slot="footer">

            <lightning-button
                label="Close"
                variant="neutral"
                onclick={handleClose}>
            </lightning-button>

        </div> -->

    <!-- </lightning-quick-action-panel> -->
    </div>

    <template if:true={showSkillModal}>
        <section
            role="dialog"
            tabindex="-1"
            class="slds-modal slds-fade-in-open slds-modal_small">

            <div class="slds-modal__container">

                <header class="slds-modal__header">
                    <h2 class="slds-text-heading_medium">
                        Select Skill
                    </h2>
                </header>

                <div class="slds-modal__content slds-p-around_medium">

                    <lightning-combobox
                        label="Skill"
                        value={selectedSkill}
                        options={skillOptions}
                        onchange={handleSkillChange}>
                    </lightning-combobox>

                </div>

                <footer class="slds-modal__footer">

                    <lightning-button
                        label="Cancel"
                        onclick={handleCancelSkill}>
                    </lightning-button>

                    <lightning-button
                        variant="brand"
                        label="Submit"
                        onclick={handleSubmitSkill}
                        class="slds-m-left_small">
                    </lightning-button>

                </footer>

            </div>
        </section>

        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

</template>
