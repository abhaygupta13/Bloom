<template>
    <div class="slds-m-around_medium">
        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-p-horizontal_small">
            <lightning-input
                type="checkbox"
                label="Check out"
                checked={checkouttimeValue}
                onchange={handleInputChange}
                disabled
            ></lightning-input>
        </div>
        <template if:true={showSuccessMessage}>
            <p class="slds-text-color_success slds-m-top_medium">✔️ Checkout details saved successfully. Click on back button.</p>
        </template>
        <div class="slds-m-top_medium slds-align_absolute-center">
            <lightning-button 
                variant="brand" 
                label="Save" 
                onclick={handleSubmit} 
                class="slds-m-right_small"
                disabled={isDisabled}>
            </lightning-button>
        </div>
    </div>
   
</template>
