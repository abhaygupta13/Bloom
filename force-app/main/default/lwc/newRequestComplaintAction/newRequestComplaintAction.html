<template>
    <lightning-card variant="brand" title="New Request/Complaint">
        <div class="slds-align_absolute-center">
            <lightning-button variant="brand" label="New Request/Complaint" title="New Request/Complaint" onclick={handleOpenModal}>
            </lightning-button>
        </div>
        <div class="slds-align_absolute-center">
            <br />
            <div>Raise a New Request/Complaint</div>
        </div>
    </lightning-card>
    <template if:true={isShowModal}>
        <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true"
            aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open slds-modal_medium">
            <div class="slds-modal__container">
                <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                    title="Close" onclick={closeModal}>
                    <lightning-icon icon-name="utility:close" size="small" alternative-text="Close"></lightning-icon>
                </button>
                <c-service-request-complaint-action request-from={requestFrom} record-id={recordId} onclosemodal={closeModal}></c-service-request-complaint-action>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
