<template>
    
    <lightning-quick-action-panel header="">
        <div class="slds-p-around_medium">
                <div class="slds-p-around_medium">
                    <lightning-input
                        type="checkbox"
                        label="PDC"
                        data-id="pdc"
                        onchange={handleChange}>
                    </lightning-input>

                    <lightning-input
                        type="checkbox"
                        label="Security Deposit"
                        data-id="sd"
                        onchange={handleChange}>
                    </lightning-input>

                    <!-- <lightning-input
                        type="checkbox"
                        label="Show Details"
                        data-id="sd1"
                        onchange={handleChange}>
                    </lightning-input> -->
                </div>

            <div class="slds-m-top_medium">
                <lightning-button label="Proceed" variant="brand" onclick={handleProceed}>
                </lightning-button>
                <lightning-button label="Cancel" variant="neutral" class="slds-m-left_small" onclick={handleCancel}>
                </lightning-button>
            </div>
        </div>
    </lightning-quick-action-panel>
    <lightning-spinner if:true={isLoading} class="customSpinner" alternative-text="Loading..."></lightning-spinner>
</template>
