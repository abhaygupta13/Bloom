    <lightning-card>
    <div if:true={flags.isLoading} class="slds-is-relative">
        <lightning-spinner alternative-text="Loading..." variant="brand" style="position:fixed;">
        </lightning-spinner>
    </div>

   <!--  <div class="slds-p-around_small slds-m-bottom_small">
        <div class="slds-notify slds-notify_alert slds-theme_alert-texture" role="status">
            <span class="slds-icon_container slds-m-right_x-small" title="Warning">
                <lightning-icon icon-name="utility:warning" alternative-text="warning" size="small"></lightning-icon>
            </span>
            <div class="slds-notify__content">
                <div style="background-color: #ffe4e4; border: 1px solid #ff0000; padding: 8px; border-radius: 4px;">
                    <div style="color: #ff0000; font-weight: bold; font-size: 16px;">
                        Warning: You cannot select more than <strong>25 records</strong> at a time.
                    </div>
                </div>
            </div> 
        </div>
    </div>-->

    <div class="slds-p-around_medium custom_style">
        <div class="slds-grid slds-wrap slds-grid_vertical-align-start">
            <div class="slds-col slds-size_1-of-1 slds-medium-size_3-of-12 slds-p-horizontal_small">
                <lightning-combobox 
                    class="validate" 
                    name="Choose_Project_Obj" 
                    label={flags.projLabel}
                    value={flags.selectedProjectId} 
                    options={flags.projectObjOptions} 
                    onchange={handleSObjectChange}
                   
                        required>
                </lightning-combobox>
            </div>
			 
            

            <div class="slds-col slds-size_1-of-1 slds-medium-size_3-of-12 slds-p-horizontal_small">
                <lightning-combobox 
                    class="validate" 
                    name="Choose_Building_Object" 
                    label={flags.buildLabel}
                    value={flags.handoverPhaseId} 
                    options={flags.buildingObjOptions} 
                    onchange={handleSObjectChange}
                   
                        required>
                </lightning-combobox>
            </div>
          <div class="slds-col slds-size_1-of-1 slds-medium-size_3-of-12 slds-p-horizontal_small">
                <lightning-combobox 
                    class="validate" 
                    name="Choose_noticeType_Object" 
                    label={flags.noticeLable}
                    value={flags.noticeTypeName} 
                    options={noticeTypeOption} 
                    onchange={handleSObjectChange}
                    required>
                </lightning-combobox>
            </div>
            
           

           <div class="slds-col slds-size_1-of-1 slds-medium-size_3-of-12 slds-p-horizontal_small">
    <template if:true={showSearchButton}>
        <div style="padding-top: 1.5rem;"> 
            <button 
                class="slds-button slds-button_brand" 
                onclick={handleSearchClick} 
                title="Handover Search">
                Search
            </button>
        </div>
    </template>
</div>
        </div>
          <div class="slds-notify__content">
                <div style="background-color: #ffe4e4; border: 1px solid #ff0000; padding: 8px; border-radius: 4px;">
                    <div style="color: #ff0000; font-weight: bold; font-size: 16px;">
                        Warning: You cannot select more than <strong>20 records</strong> at a time.
                    </div>
                </div>
            </div>
          <div if:false={flags.isVisiableTable}>
            <div class="slds-box slds-theme_default slds-text-align_center slds-m-top_medium">
                <div class="slds-illustration slds-illustration_large" aria-hidden="true">
                    <img src="/img/chatter/Desert.svg" class="slds-illustration__svg" alt="" />
                    <div class="slds-text-longform slds-m-top_medium">
                        <h3 class="slds-text-heading_medium">No Records Found</h3>
                        <p class="slds-text-body_regular">We couldn't find any records matching your search criteria. Please try different filters.</p>
                    </div>
                </div>
            </div>
          </div>
        
        <div if:true={flags.isVisiableTable} class="slds-grid slds-wrap slds-m-top_medium">
            <div class="slds-col slds-size_12-of-12 slds-p-around_small">
                <div class="slds-clearfix">
                    <div class="slds-float_right slds-m-bottom_small">
                        <p><b>Number of selected records: {selectedRecordCount}</b></p>
                    </div>
                </div>
               <div class="table-container slds-border_top slds-border_bottom slds-border_left slds-border_right table-wrapper">
                    <lightning-datatable 
                        key-field="Id" 
                        data={flags.tableData} 
                        columns={flags.tableColumns}
                        sorted-by={sortBy}
                        sorted-direction={sortDirection}
                        onsort={doSorting}
                        onrowselection={handleRowSelection}>
                    </lightning-datatable>
                    <div if:true={flags.isVisiableTable}>
           <div class="slds-p-around_medium slds-text-align_right">
            <template if:true={sendBCCMailNotification}>
                <button class="slds-button slds-button_brand " onclick={handleSubmit}>Send</button>
            </template> 
            <template if:true={sendNOCCHOMailNotification}>
                <button class="slds-button slds-button_brand" onclick={handleNOCCHOSubmit}>Send</button>
            </template>
           <!--  <template if:true={sendCHONotification}>
                <button class="slds-button slds-button_brand" onclick={handleUnitReadySubmit}>Send</button>
            </template> -->
        </div>
         </div>
                </div>
            </div>
        </div>
         
    </div>
    </lightning-card>
</template>
