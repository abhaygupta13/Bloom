<template>
	<lightning-quick-action-panel header="Update Sub Status" class="outer-div">

		<template if:true={isLoading}>
			<lightning-spinner alternative-text="Loading" size="medium" variant="brand" class="customSpinner">
			</lightning-spinner>
		</template>	

				<template if:true={recordId}>

				<template if:true={nextApplicableStatusOptions}>
					<lightning-combobox required name="Sub Status" onchange={handleSubStatusChange}
						dropdown-alignment="auto" label="Sub Status" options={nextApplicableStatusOptions}>
					</lightning-combobox>


					<template if:true={showRejectOption}>
						<lightning-combobox required name="Rejected Reason" onchange={handleSubStatusChange}
							dropdown-alignment="auto" label="Rejected Reason" options={rejectReasonsOptions}>
						</lightning-combobox>

					</template>
					<template if:true={showSpasignDate}>
						<lightning-input name="Customer Signed SPA Date" type='date' label="Customer Signed SPA Date" value={customerSignedSpaDate}
							onchange={handleSubStatusChange} required ></lightning-input>
					</template>

					<lightning-textarea name="Remarks" label="Remarks" placeholder="Enter Remarks here..."
						class="inputRemarks" onchange={handleSubStatusChange}></lightning-textarea>

					<div slot="footer">
						<lightning-button variant="neutral" label="Cancel" onclick={handleCancel}></lightning-button>
						<lightning-button variant="brand" label="Save" class="slds-m-left_x-small"
							onclick={handleSubmit} disabled={disableSavebutton}></lightning-button>
					</div>

				</template>
			</template>
		

	</lightning-quick-action-panel>
</template>
