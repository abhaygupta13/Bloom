<template>
    <div class="slds-is-relative" style="min-height: 20vh;">
        <template if:true={isLoading}>
            <lightning-spinner
                alternative-text="Loading"
                size="medium">
            </lightning-spinner>
        </template>

        <lightning-quick-action-panel header="Send to Finance">
            <lightning-layout multiple-rows>

                <!-- Check Status -->
                <lightning-layout-item size="6" class="slds-p-horizontal_small">
                    <lightning-combobox
                        name="checkStatus"
                        label="Check Status"
                        value={checkStatus}
                        options={checkStatusOptions}
                        onchange={handleFieldChange}
                        required>
                    </lightning-combobox>
                </lightning-layout-item>

                <!-- Finance User -->
                <lightning-layout-item size="6" class="slds-p-horizontal_small">
                    <lightning-record-picker
                        name="financeUser"
                        label="Finance User"
                        object-api-name="User"
                        filter={financeUserFilter}
                        onchange={handleFieldChange}
                        required>
                    </lightning-record-picker>
                </lightning-layout-item>

                <!-- Proof of Payment -->
                <lightning-layout-item size="12" class="slds-p-horizontal_small">
                    <lightning-input
                        type="file"
                        name="proofOfPayment"
                        label="Proof of Payment"
                        onchange={handleFieldChange}
                        required>
                    </lightning-input>

                    <template if:true={proofOfPaymentFileName}>
                        <p class="slds-m-top_x-small">
                            <strong>Selected File:</strong>
                            {proofOfPaymentData.filename}
                        </p>
                    </template>
                </lightning-layout-item>

            </lightning-layout>

            <!-- Footer -->
            <lightning-layout
                horizontal-align="end"
                class="slds-p-horizontal_small slds-p-top_medium">
                <lightning-layout-item>
                    <lightning-button
                        variant="brand"
                        label="Submit"
                        onclick={handleSubmit}
                        disabled={disableSubmitButton}>
                    </lightning-button>
                </lightning-layout-item>
            </lightning-layout>
        </lightning-quick-action-panel>
    </div>
</template>
