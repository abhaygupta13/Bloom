<template>
    <template if:true={isModalOpen}>
        <!-- Modal Header (Fixed) -->
        <lightning-modal-header label="Send Registration Verification Notification"></lightning-modal-header>
        
        <!-- Modal Body with scrollable content -->
        <lightning-modal-body class="modal-body scrollable slds-modal__content slds-p-around_medium" style="max-height: 300px; overflow-y: auto;" data-scoped-scroll="true">
            <template if:true={showLoading}>
                <lightning-spinner alternative-text="Loading..." size="medium" class="spinnerClass"></lightning-spinner>
            </template>
            <template if:false={showErrorMsg}>
                <lightning-formatted-rich-text value={template}></lightning-formatted-rich-text>
            </template>
            
            <!-- Error message -->
            <template if:true={showErrorMsg}>
                <p class="slds-align_absolute-center slds-text-heading_small slds-text-color_error">{errorMsg}</p>
            </template>
            
            <template if:true={fileData.length}>
                <div class="slds-m-horizontal_xx-large slds-grid">
                    <div class="slds-size_3-of-6 slds-m-horizontal_xx-large">
                        <p class="slds-text-title_bold slds-m-horizontal_xx-large slds-m-bottom_small">Attachments:</p>
                        <ul class="slds-m-horizontal_xx-large">
                            <template for:each={fileData} for:item="file" for:index="index">
                                <li key={file.filename} class="slds-list__item slds-grid slds-grid_align-spread slds-box slds-box_xx-small slds-p-around_xx-small slds-theme_shade">
                                    <span class="slds-text-truncate">{file.filename}</span>
                                    <!-- Cross icon to remove the file -->
                                    <button class="slds-button slds-button_icon slds-button_icon-inverse" onclick={handleRemoveFile} data-index={index} title="Remove File">
                                        <lightning-icon icon-name="utility:close" size="small"></lightning-icon>
                                        <span class="slds-assistive-text">Remove File</span>
                                    </button>
                                </li>
                            </template>
                        </ul>
                    </div>
                    <div class="slds-size_3-of-6"></div>
                </div>
            </template>

            <template if:true={showFileUpload}>
                <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true"
                    aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">
                    <div class="slds-modal__container">
                        <header class="slds-modal__header">
                            <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                                title="Close" onclick={handleCloseModal}>
                                <lightning-icon icon-name="utility:close" alternative-text="close" variant="brand"
                                    size="small"></lightning-icon>
                                <span class="slds-assistive-text">Close</span>
                            </button>
                            <h2 id="modal-heading-01" class="slds-text-heading_medium slds-hyphenate">Document</h2>
                        </header>
        
                        <div class="slds-modal__content slds-p-around_medium">
                            <div class="slds-grid slds-wrap slds-p-around_medium">
                                <div class="slds-p-horizontal_large">
                                <lightning-layout multiple-rows="false">
                                  
                                    <lightning-layout-item size="12" padding="horizontal-large">
                                        <div class="slds-align_absolute-center">
                                            <lightning-input type="file" accept=".png, .jpg, .jpeg, .pdf" multiple="false"
                                                label="Document" onchange={handleFileUploadChange}></lightning-input>
                                        </div>
                                        <div class="slds-align_absolute-center">
                                            <template if:true={uploadedFiles}>
                                                <p class="slds-align_absolute-center">{uploadedFileNames}</p>
                                            </template>
                                        </div>
                                        <br />
                                    </lightning-layout-item>
                                </lightning-layout>
                            </div>
                            </div>
                        </div>
                        <footer class="slds-modal__footer">
                            <lightning-button onclick={handleCloseModal} variant="neutral" label="Cancel"></lightning-button>
                            &nbsp;&nbsp;
                            <lightning-button onclick={handleFileUpload} variant="brand" label="Submit"></lightning-button>
                        </footer>
                    </div>
                </section>
                <div class="slds-backdrop slds-backdrop_open"></div>
            </template>
        </lightning-modal-body>

        <!-- Modal Footer (Fixed) -->
        <lightning-modal-footer class="modal-footer">
            <lightning-button onclick={handleCancel} variant="neutral" label="Cancel"></lightning-button>
            &nbsp;&nbsp;
            <!--<lightning-button if:true={showEmailAction} onclick={handleAttach} variant="brand" label="Attachment"></lightning-button>
            &nbsp;&nbsp;-->
            <lightning-button if:true={showEmailAction} onclick={handleSend} variant="brand" label="Send"></lightning-button>
        </lightning-modal-footer>
    </template>
</template>
