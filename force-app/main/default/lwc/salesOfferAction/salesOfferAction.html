<template>
    <template if:true={isShowModal}>
        <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true"
            aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">

                <!-- Header -->
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                        title="Close" onclick={handleCloseModal}>
                        <lightning-icon icon-name="utility:close" alternative-text="close" variant="brand"
                            size="small"></lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>
                    <h2 id="modal-heading-01" class="slds-text-heading_medium slds-hyphenate">Sales Offer</h2>
                </header>

                <!-- Modal Body -->
                <div class="slds-modal__content slds-p-around_medium">
                    <template if:true={showLoading}>
                        <lightning-spinner alternative-text="Loading..." size="medium" class="spinnerClass"></lightning-spinner>
                    </template>

                    <!-- UNIT DETAILS -->
                    <template if:true={isUnitTab}>
                        <lightning-card title="Unit Details">
                            <lightning-layout multiple-rows="true">

                                <lightning-layout-item size={columnSize} padding="horizontal-small">
                                    <lightning-combobox required label="Project" name="ProjectId"
                                        placeholder="Select Project" options={projectList}
                                        onchange={handleProjectOnChange}>
                                    </lightning-combobox>
                                </lightning-layout-item>

                                <lightning-layout-item size={columnSize} padding="horizontal-small">
                                    <lightning-combobox label="Unit Model" placeholder="Select Unit Model"
                                        options={unitModelList} onchange={handleUnitModelOnChange}>
                                    </lightning-combobox>
                                </lightning-layout-item>

                                <lightning-layout-item size={columnSize} padding="horizontal-small">
                                    <lightning-combobox required label="Customer Type" placeholder="Select Customer Type"
                                        options={customerTypeList} value={selectedCustomerType} onchange={handleCustomerTypeOnChange}>
                                    </lightning-combobox>
                                </lightning-layout-item>

                                <lightning-layout-item size={columnSize} padding="horizontal-small">
                                    <lightning-combobox required label="Direct/Indirect" placeholder="Select Direct/Indirect"
                                        options={directTypeList} value={selectedDirectType} onchange={handleDirectTypeOnChange}>
                                    </lightning-combobox>
                                </lightning-layout-item>

                                <lightning-layout-item size={columnSize} padding="horizontal-small">
                                    <lightning-combobox label="Offer Type" placeholder="Select Offer Type"
                                        options={offerTypeList} value={selectedOfferType} onchange={handleOfferTypeOnChange}>
                                    </lightning-combobox>
                                </lightning-layout-item>

                                <lightning-layout-item size={columnSize} padding="horizontal-small">
                                    <lightning-combobox required label="Price Type" placeholder="Select Price Type"
                                        options={priceTypeList} value={selectedPriceType} onchange={handlePriceOnChange}>
                                    </lightning-combobox>
                                </lightning-layout-item>

                                <!-- Payment Plan -->
                                <lightning-layout-item size={columnSize} padding="horizontal-small">
                                    <lightning-combobox 
                                        label="Payment Plan" 
                                        placeholder="Select Payment Plan"
                                        options={paymentPlanList} 
                                        onchange={handlePaymentPlanSelect}>
                                    </lightning-combobox>

                                    <!-- Pills just below combobox -->
                                    <template if:true={selectedPaymentPlans.length}>
                                        <div class="slds-pill_container" style="margin-top: 0.5rem;">
                                            <template for:each={selectedPaymentPlans} for:item="plan">
                                                <lightning-pill key={plan.value} label={plan.label} name={plan.value} onremove={handleRemovePaymentPlan}>
                                                </lightning-pill>
                                            </template>
                                        </div>
                                    </template>
                                </lightning-layout-item>

                                <template if:true={isUnitTab}>
                                <lightning-layout-item size="12" padding="horizontal-small">     
    <div class="slds-table_edit_container slds-is-relative" style="width: 100%; overflow-x: auto; margin-top: 10px; padding: 0;">
    <table class="slds-table slds-table_cell-buffer slds-table_bordered" style="width: 100%; border:1px solid #ccc;">
        <thead>
            <tr class="slds-line-height_reset">
                <th></th>
                <th scope="col">Unit Name</th>
                <th scope="col">Unit Type</th>
                <th scope="col">Unit Category</th>
                <th scope="col">Bedrooms</th>
                <th scope="col">Internal Area</th>
                <th scope="col">External Area</th>
                <th scope="col">Selling Price</th>
            </tr>
        </thead>
        <tbody>
            <template if:true={unitList}>
                <template for:each={unitList} for:item="unit" for:index="indexVar">
                    <tr key={unit.Id} aria-selected="false" class="slds-hint-parent">
                        <td class="slds-truncate" tabindex="0">
                            <lightning-input 
                                type="radio" 
                                name="unitSelection"
                                data-id={unit.Id}
                                onchange={handleRadioSelect}
                                checked={unit.isSelected}>
                            </lightning-input>
                        </td>
                        <td class="slds-truncate" tabindex="0" style="white-space: nowrap;">
                            <a data-id={unit.Id} target="_blank" onclick={navigateToRecordPage}>
                                {unit.Name}
                            </a>
                        </td>
                        <td class="slds-truncate" tabindex="0">
                            <span>{unit.UnitType__c}</span>
                        </td>
                        <td class="slds-truncate" tabindex="0">
                            <span>{unit.UnitCategory__c}</span>
                        </td>
                        <td class="slds-truncate" tabindex="0">
                            <span>{unit.NumberOfBedrooms__c}</span>
                        </td>
                        <td class="slds-truncate" tabindex="0">
                            <lightning-formatted-number 
                                value={unit.Internal_Saleable_Area__c}
                                minimum-fraction-digits="2" 
                                maximum-fraction-digits="2">
                            </lightning-formatted-number>
                        </td>
                        <td class="slds-truncate" tabindex="0">
                            <lightning-formatted-number 
                                value={unit.External_Saleable_Area__c}
                                minimum-fraction-digits="2" 
                                maximum-fraction-digits="2">
                            </lightning-formatted-number>
                        </td>
                        <td class="slds-truncate" tabindex="0">
                            <lightning-formatted-number 
                                format-style="currency"
                                value={unit.SellingPrice__c}
                                currency-code="AED"
                                minimum-fraction-digits="2"
                                maximum-fraction-digits="2">
                            </lightning-formatted-number>
                        </td>
                    </tr>
                </template>
            </template>
            <template if:false={unitList}>
                <tr>
                    <td colspan="9" class="slds-text-align_center">
                        No units available for the selected project/model.
                    </td>
                </tr>
            </template>
        </tbody>
    </table>
</div>
</lightning-layout-item>
</template>


                            </lightning-layout>
                        </lightning-card>
                    </template>

                    <!-- CUSTOMER DETAILS -->
                    <template if:true={isCustomerTab}>
                        <lightning-card title="Customer Details" class="slds-p-around_small">
                            <lightning-layout multiple-rows="true">

                                <lightning-layout-item size={columnSize} padding="horizontal-small">
                                    <lightning-input type="text" label="First Name" onchange={handleFirstNameChange}></lightning-input>
                                </lightning-layout-item>

                                <lightning-layout-item size={columnSize} padding="horizontal-small">
                                    <lightning-input type="text" label="Last Name" onchange={handleLastNameChange}></lightning-input>
                                </lightning-layout-item>

                                <lightning-layout-item size="12" padding="horizontal-small">
                                    <lightning-input type="email" label="Email" onchange={handleEmailChange}></lightning-input>
                                </lightning-layout-item>

                                <lightning-layout-item size="12" padding="horizontal-small">
                                    <lightning-textarea label="Remarks" onchange={handleRemarksChange}></lightning-textarea>
                                </lightning-layout-item>

                            </lightning-layout>
                        </lightning-card>
                    </template>

                </div>

                <!-- Footer -->
                <footer class="slds-modal__footer">
                    <template if:true={isUnitTab}>
                        <lightning-button onclick={handleCloseModal} variant="neutral" label="Cancel"></lightning-button>
                        &nbsp;&nbsp;
                        <lightning-button onclick={goToCustomerTab} variant="brand" label="Next"></lightning-button>
                    </template>
                    <template if:true={isCustomerTab}>
                        <lightning-button onclick={goToUnitTab} variant="neutral" label="Previous"></lightning-button>
                        &nbsp;&nbsp;
                        <lightning-button onclick={handleGenerateSalesOffer} variant="brand" label="Submit"></lightning-button>
                    </template>
                </footer>

            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
