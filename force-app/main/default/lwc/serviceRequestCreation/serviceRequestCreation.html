<template>
    <lightning-card title="Create Service Request" icon-name="standard:case">
        <div class="slds-p-around_medium slds-is-relative">
            <!-- Spinner -->
            <template if:true={isLoading}>
                <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
            </template>

            <!-- Eligibility Message Warning -->
            <template if:true={eligibilityMessage}>
                <div class="slds-notify slds-notify_alert slds-alert_warning slds-m-bottom_medium" role="alert">
                    <span class="slds-assistive-text">warning</span>
                    <lightning-icon icon-name="utility:warning" variant="inverse" size="x-small" class="slds-m-right_x-small"></lightning-icon>
                    <h2>{eligibilityMessage}</h2>
                </div>
            </template>

            <!-- Form -->
            <div class="slds-grid slds-wrap slds-gutters">
                <!-- Type -->
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-m-bottom_small">
                    <lightning-combobox
                        name="type"
                        label="Type"
                        value={selectedType}
                        placeholder="Select Type"
                        options={typeOptions}
                        onchange={handleTypeChange}
                        required>
                    </lightning-combobox>
                </div>

                <!-- Category -->
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-m-bottom_small">
                    <lightning-combobox
                        name="category"
                        label="Category"
                        value={selectedCategory}
                        placeholder="Select Category"
                        options={categoryOptions}
                        onchange={handleCategoryChange}
                        disabled={isCategoryDisabled}
                        required>
                    </lightning-combobox>
                </div>

                <!-- Sub Category -->
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-m-bottom_small">
                    <lightning-combobox
                        name="subcategory"
                        label="Sub Category"
                        value={selectedSubCategory}
                        placeholder="Select Sub Category"
                        options={subCategoryOptions}
                        onchange={handleSubCategoryChange}
                        disabled={isSubCategoryDisabled}
                        required>
                    </lightning-combobox>
                </div>

                <!-- Unit -->
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-m-bottom_small">
                    <lightning-combobox
                        name="unit"
                        label="Unit"
                        value={selectedUnit}
                        placeholder="Select Unit"
                        options={unitOptions}
                        onchange={handleUnitChange}>
                    </lightning-combobox>
                </div>

                <!-- Case Origin -->
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-m-bottom_small">
                    <lightning-combobox
                        name="origin"
                        label="Origin"
                        value={selectedOrigin}
                        placeholder="Select Origin"
                        options={originOptions}
                        onchange={handleOriginChange}
                        required>
                    </lightning-combobox>
                </div>

                <!-- Spacer for grid alignment -->
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-m-bottom_small"></div>

                <!-- Description -->
                <div class="slds-col slds-size_1-of-1 slds-m-bottom_medium">
                    <lightning-textarea
                        name="description"
                        label="Description"
                        value={description}
                        placeholder="Enter description..."
                        onchange={handleDescriptionChange}
                        rows="4">
                    </lightning-textarea>
                </div>
            </div>

            <!-- Footer Buttons -->
            <div class="slds-grid slds-grid_align-end slds-m-top_medium">
                <lightning-button
                    label="Cancel"
                    variant="neutral"
                    onclick={handleCancel}
                    class="slds-m-right_small">
                </lightning-button>
                <lightning-button
                    label="Create Case"
                    variant="brand"
                    onclick={handleCreate}
                    disabled={isLoading}>
                </lightning-button>
            </div>
        </div>
    </lightning-card>
</template>
