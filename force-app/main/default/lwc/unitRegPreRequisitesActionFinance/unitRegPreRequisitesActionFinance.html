<template>
    <lightning-quick-action-panel header={header} style="overflow-x: auto;">
        <template lwc:if={isLoading}>
            <lightning-spinner alternative-text="Loading" variant="brand" size="large">
            </lightning-spinner>
        </template>
        <template if:true={isConfirm}>
            <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true"
                aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container" style="width:50% !important">
                    <!-- modal header start -->
                    <header class="slds-theme_alert-texture slds-modal__header">
                        <h2 id="modal-heading-01" class="slds-text-heading_medium slds-hyphenate">Confirm</h2>
                    </header>

                    <!-- modal body start -->
                    <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1"
                        style="text-align:center">
                        <p>Please make sure you have entered correct information.</p>
                    </div>

                    <!-- modal footer start-->
                    <footer class="slds-modal__footer">
                        <button class="slds-button slds-button_neutral" onclick={closeConfirmBox}>Cancel</button>
                        <button class="slds-button slds-button_brand" onclick={confirmBoxYes}>Confirm</button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>
        <div style="height:300px;" lwc:if={data.length}>
            <!-- <lightning-datatable key-field="Id" data={data} columns={columns} selected-rows={selectedRowKeys}
                    onrowselection={handleRowSelection}>
                </lightning-datatable> -->
            <table class="table-container slds-table slds-table_bordered slds-table_cell-buffer">
                <thead>
                    <tr>
                        <!-- <th class="checkboxColumn">
                            <div class="slds-truncate" title="Select All">
                                <lightning-input type="checkbox" onchange={onSelecAllCheckbox}>
                                </lightning-input>
                            </div>
                        </th> -->
                        <th>
                            <div class="center slds-truncate" title="Sales Order">Sales Order</div>
                        </th>
                        <th>
                            <div class="center slds-truncate" title="Status">Status</div>
                        </th>
                        <th>
                            <div class="center slds-truncate" title="Unit Number">Unit Number</div>
                        </th>
                        <th>
                            <div class="center slds-truncate" title="Plot Number">Plot Number</div>
                        </th>
                        <th>
                            <div class="center slds-truncate" title="Sold Date">Sold Date</div>
                        </th>
                        <th>
                            <div class="center slds-truncate" title="ADM Fee Included">ADM Fee Included</div>
                        </th>
                        <th>
                            <div class="center slds-truncate" title="ADM Fee AED">ADM Fee Cleared Amount(AED)</div>
                        </th>
                        <th>
                            <div class="center slds-truncate" title="Fund Moved to GR Card Date">Fund Moved Date</div>
                        </th>
                    </tr>
                </thead>
                <tbody>
                    <template for:each={data} for:item="row">
                        <tr key={row.id}>
                            <!-- Checkbox Column -->
                            <!-- <td>
                                <div class="slds-truncate" title={row.Name}>
                                    <template lwc:if={row.mandatoryDocumentsAvailable}>
                                        <lightning-input type="checkbox" data-id={row.Id} checked={row.isChecked}
                                            disabled={row.isReadOnly} onchange={onCheckboxClick}>
                                        </lightning-input>
                                    </template>
                                    <template lwc:else>
                                        <lightning-input type="checkbox" disabled=true>
                                        </lightning-input>
                                    </template>
                                </div>
                            </td> -->
                            <td>
                                <div class="center slds-truncate" title={row.activeSalesOrderName}>
                                    <a href={row.salesOrderLink} target="_blank">{row.activeSalesOrderName}</a>
                                </div>
                            </td>
                            <td>
                                 <div class="center slds-truncate" title={row.Status__c}>{row.Status__c}</div>
                            </td>

                            <td>
                                <div class="center slds-truncate" title={row.Name}>
                                    <a href={row.unitLink} target="_blank">{row.Name}</a>
                                </div>
                            </td>
                            <td>
                                <div class="center slds-truncate" title={row.plotNumber}>
                                    {row.plotNumber}
                                </div>
                            </td>
                            <td>
                                <div class="center slds-truncate" title={row.soldDate}>
                                    {row.soldDate}</div>
                            </td>
                            <td>
                                <!-- <div class="slds-grid slds-grid_align-center slds-grid_vertical-align-center"> -->
                                <div class="center slds-truncate">
                                    <!-- <lightning-input message-toggle-inactive="" message-toggle-active=""
                                                    type="toggle" checked={row.isFundMoved} disabled>
                                                </lightning-input> -->
                                    <template lwc:if={row.admFeeIncluded}>
                                        Yes
                                        <!-- <lightning-icon icon-name='utility:check' size='small' title='Completed'
                                            variant="success">
                                        </lightning-icon> -->
                                    </template>
                                    <template lwc:else>
                                        No
                                        <!-- <lightning-icon icon-name='utility:close' size='small' title='Not Completed'
                                            variant="error">
                                        </lightning-icon> -->
                                    </template>
                                </div>
                                <!-- <lightning-input class="slds-align_absolute-center" variant="label-hidden" message-toggle-inactive=""
                                        message-toggle-active="" type="toggle" data-id={row.Id} 
                                        checked={row.admFeeIncluded}
                                        disabled>
                                    </lightning-input>
                                </div> -->
                            </td>
                            <td>
                                <!-- <div class="slds-grid slds-grid_align-center slds-grid_vertical-align-center"> -->
                                <div class="center slds-truncate">
                                    {row.admFee}
                                </div>
                            </td>
                            <td>
                                <div class="slds-grid slds-grid_align-center slds-grid_vertical-align-center">
                                    <lightning-input 
                                        type="date"
                                        variant="label-hidden"
                                        data-id={row.Id}
                                        value={row.fundMovedToGRDate}
                                        onchange={handleDateChange}>
                                    </lightning-input>
                                </div>
                            </td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </div>

        <div slot="footer">
            <lightning-button variant="neutral" label="Cancel" onclick={closAction}></lightning-button>
            <lightning-button variant="brand" disabled={isSaveButtonDisabled} label="Save" class="slds-m-left_x-small"
                onclick={handleSaveClick}>
            </lightning-button>
        </div>
    </lightning-quick-action-panel>
</template>
